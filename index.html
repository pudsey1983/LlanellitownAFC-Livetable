<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Llanelli Town AFC | Cymru South Table</title>
  <meta name="description" content="Live Cymru South league table for Llanelli Town AFC.">
  <style>
    :root{
      --red:#d71920;
      --red-dark:#a90f15;
      --black:#0f1115;
      --charcoal:#1a1d23;
      --white:#ffffff;
      --offwhite:#f6f6f7;
      --line:#e3e5e8;
      --muted:#70757d;
      --win:#17834f;
      --draw:#6c727a;
      --loss:#272a2f;
      --shadow:0 12px 34px rgba(0,0,0,.10);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:transparent;
      color:var(--black);
      font-family:Arial, Helvetica, sans-serif;
    }

    .lt-widget{
      width:100%;
      max-width:1180px;
      margin:0 auto;
      background:var(--white);
      border:1px solid var(--line);
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .lt-topbar{
      height:8px;
      background:linear-gradient(90deg,var(--red),var(--red-dark));
    }

    .lt-header{
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(135deg, rgba(215,25,32,.98), rgba(148,10,16,.98)),
        var(--red);
      color:var(--white);
      padding:24px 26px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
    }

    .lt-header::after{
      content:"";
      position:absolute;
      right:-65px;
      top:-95px;
      width:260px;
      height:260px;
      border:40px solid rgba(255,255,255,.08);
      border-radius:50%;
      pointer-events:none;
    }

    .lt-brand{
      display:flex;
      align-items:center;
      gap:15px;
      min-width:0;
      position:relative;
      z-index:1;
    }

    .lt-crest{
      width:62px;
      height:62px;
      flex:0 0 62px;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.85);
      background:rgba(0,0,0,.16);
      font-weight:900;
      font-size:17px;
      letter-spacing:.06em;
    }

    .lt-title{
      min-width:0;
    }

    .lt-club{
      margin:0 0 2px;
      font-size:13px;
      line-height:1.2;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
      opacity:.92;
    }

    .lt-title h1{
      margin:0;
      font-size:clamp(24px,4vw,36px);
      line-height:1;
      font-weight:900;
      letter-spacing:-.02em;
    }

    .lt-title p{
      margin:7px 0 0;
      font-size:14px;
      opacity:.92;
    }

    .lt-live{
      position:relative;
      z-index:1;
      text-align:right;
      flex:0 0 auto;
    }

    .lt-live-badge{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      border:1px solid rgba(255,255,255,.38);
      background:rgba(0,0,0,.16);
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .lt-live-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 0 3px rgba(255,255,255,.17);
    }

    .lt-updated{
      margin-top:7px;
      font-size:11px;
      opacity:.86;
      white-space:nowrap;
    }

    .lt-table-wrap{
      width:100%;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      background:var(--white);
    }

    table{
      width:100%;
      min-width:920px;
      border-collapse:collapse;
      table-layout:auto;
    }

    thead th{
      background:var(--black);
      color:var(--white);
      padding:12px 9px;
      text-align:center;
      font-size:12px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    thead th.team{
      text-align:left;
      padding-left:16px;
      min-width:230px;
    }

    tbody tr{
      transition:background .15s ease;
    }

    tbody tr:nth-child(even):not(.is-llanelli){
      background:var(--offwhite);
    }

    tbody tr:hover:not(.is-llanelli){
      background:#ededee;
    }

    tbody td{
      padding:12px 9px;
      border-bottom:1px solid var(--line);
      text-align:center;
      font-size:14px;
      white-space:nowrap;
    }

    tbody td.team{
      text-align:left;
      padding-left:16px;
      font-weight:700;
      white-space:normal;
    }

    tbody td.pos,
    tbody td.pts{
      font-weight:900;
    }

    tbody tr.is-llanelli{
      background:linear-gradient(90deg,var(--red),#bd1218);
      color:var(--white);
      font-weight:800;
    }

    tbody tr.is-llanelli td{
      border-bottom-color:rgba(255,255,255,.17);
    }

    .team-inner{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .team-mark{
      width:28px;
      height:28px;
      flex:0 0 28px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:#dedfe2;
      color:#333;
      font-size:10px;
      font-weight:900;
    }

    .is-llanelli .team-mark{
      background:#fff;
      color:var(--red);
    }

    .gd-pos{color:#147746;font-weight:800}
    .gd-neg{color:#b21319;font-weight:800}
    .is-llanelli .gd-pos,
    .is-llanelli .gd-neg{color:#fff}

    .form{
      display:flex;
      justify-content:center;
      gap:3px;
    }

    .form span{
      width:22px;
      height:22px;
      display:inline-grid;
      place-items:center;
      border-radius:50%;
      color:#fff;
      font-size:10px;
      font-weight:900;
      line-height:1;
    }

    .form .w{background:var(--win)}
    .form .d{background:var(--draw)}
    .form .l{background:var(--loss)}
    .is-llanelli .form span{
      border:1px solid rgba(255,255,255,.45);
    }

    .lt-footer{
      padding:11px 16px;
      background:#fafafa;
      color:var(--muted);
      border-top:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      font-size:11px;
      line-height:1.4;
    }

    .lt-error{
      padding:34px 18px;
      text-align:center;
      color:#9e141a;
      font-weight:700;
    }

    @media (max-width:700px){
      .lt-header{
        padding:18px 16px;
        align-items:flex-start;
      }

      .lt-crest{
        width:50px;
        height:50px;
        flex-basis:50px;
        font-size:14px;
      }

      .lt-title h1{
        font-size:24px;
      }

      .lt-title p{
        font-size:12px;
      }

      .lt-live{
        display:none;
      }

      thead th,
      tbody td{
        padding-top:10px;
        padding-bottom:10px;
      }
    }

    @media (prefers-reduced-motion: reduce){
      tbody tr{transition:none}
    }
  </style>
</head>
<body>
  <section class="lt-widget" aria-label="Llanelli Town AFC Cymru South league table">
    <div class="lt-topbar"></div>

    <header class="lt-header">
      <div class="lt-brand">
        <div class="lt-crest" aria-hidden="true">LTAFC</div>
        <div class="lt-title">
          <div class="lt-club">Llanelli Town AFC</div>
          <h1>Cymru South</h1>
          <p>Official league standings</p>
        </div>
      </div>

      <div class="lt-live">
        <div class="lt-live-badge">
          <span class="lt-live-dot"></span>
          Live table
        </div>
        <div class="lt-updated" id="ltUpdated">Loading latest data…</div>
      </div>
    </header>

    <div class="lt-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Pos</th>
            <th class="team">Team</th>
            <th>P</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
            <th>GF</th>
            <th>GA</th>
            <th>GD</th>
            <th>Pts</th>
            <th>Form</th>
          </tr>
        </thead>
        <tbody id="ltBody">
          <tr>
            <td colspan="11" style="padding:34px;text-align:center;">Loading league table…</td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer class="lt-footer">
      <span>Standings sourced from FAW competition data.</span>
      <span>Checks for updated standings every 5 minutes.</span>
    </footer>
  </section>

  <script>
    (() => {
      const API_URL = "./standings.json";
      const LLANELLI_ID = 27548;
      const REFRESH_MS = 5 * 60 * 1000;

      const body = document.getElementById("ltBody");
      const updated = document.getElementById("ltUpdated");

      const esc = (value) => String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

      const initials = (name) => {
        const clean = String(name || "").replace(/\b(AFC|FC)\b/gi, "").trim();
        const parts = clean.split(/\s+/).filter(Boolean);
        if (!parts.length) return "?";
        if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
      };

      const formHtml = (row) => {
        const games = [row.m1,row.m2,row.m3,row.m4,row.m5]
          .filter(x => x && x.result)
          .map(x => String(x.result).toUpperCase());

        if (!games.length) return "—";

        return `<div class="form">${games.map(r =>
          `<span class="${r.toLowerCase()}">${esc(r)}</span>`
        ).join("")}</div>`;
      };

      const rowHtml = (row) => {
        const gf = Number(row.goalsFor || 0);
        const ga = Number(row.goalsAgainst || 0);
        const gd = gf - ga;
        const gdText = gd > 0 ? `+${gd}` : String(gd);
        const gdClass = gd > 0 ? "gd-pos" : gd < 0 ? "gd-neg" : "";
        const isLlanelli = Number(row?.team?.id) === LLANELLI_ID;
        const name = row?.team?.name || "";

        return `
          <tr class="${isLlanelli ? "is-llanelli" : ""}">
            <td class="pos">${esc(row.position)}</td>
            <td class="team">
              <div class="team-inner">
                <span class="team-mark">${esc(initials(name))}</span>
                <span>${esc(name)}</span>
              </div>
            </td>
            <td>${esc(row.played)}</td>
            <td>${esc(row.wins)}</td>
            <td>${esc(row.draws)}</td>
            <td>${esc(row.losses)}</td>
            <td>${esc(gf)}</td>
            <td>${esc(ga)}</td>
            <td class="${gdClass}">${esc(gdText)}</td>
            <td class="pts">${esc(row.points)}</td>
            <td>${formHtml(row)}</td>
          </tr>`;
      };

      async function load() {
        try {
          const res = await fetch(API_URL, {
            method: "GET",
            cache: "no-store",
            headers: { "Accept":"application/json" }
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const data = await res.json();
          if (!Array.isArray(data)) throw new Error("Unexpected FAW response");

          data.sort((a,b) => Number(a.position) - Number(b.position));
          body.innerHTML = data.map(rowHtml).join("");

          const now = new Date();
          updated.textContent = "Updated " + now.toLocaleTimeString([], {
            hour:"2-digit",
            minute:"2-digit"
          });
        } catch (err) {
          console.error(err);
          updated.textContent = "Unable to refresh";
          body.innerHTML = `<tr><td colspan="11" class="lt-error">
            The league table is temporarily unavailable.
          </td></tr>`;
        }
      }

      load();
      setInterval(load, REFRESH_MS);
    })();
  </script>
</body>
</html>
