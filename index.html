<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Llanelli Town AFC | Cymru South Table</title>
  <meta name="description" content="Live Cymru South league table for Llanelli Town AFC.">
  <style>
    :root{
      --red:#d71920;
      --red-dark:#a90f15;
      --black:#0f1115;
      --white:#ffffff;
      --offwhite:#f5f5f6;
      --line:#e2e3e5;
      --muted:#6f747b;
      --win:#17834f;
      --draw:#6b7178;
      --loss:#26292e;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:transparent;
      color:var(--black);
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      overflow-x:hidden;
    }

    .lt-widget{
      width:100%;
      margin:0;
      background:var(--white);
      border:1px solid var(--line);
      overflow:hidden;
    }

    .lt-topbar{
      height:5px;
      background:linear-gradient(90deg,var(--red),var(--red-dark));
    }

    .lt-header{
      background:linear-gradient(135deg,var(--red),var(--red-dark));
      color:var(--white);
      padding:12px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .lt-brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .lt-crest{
      width:40px;
      height:40px;
      flex:0 0 40px;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:1.5px solid rgba(255,255,255,.85);
      background:rgba(0,0,0,.13);
      font-weight:900;
      font-size:11px;
      letter-spacing:.04em;
    }

    .lt-title{
      min-width:0;
    }

    .lt-club{
      margin:0 0 2px;
      font-size:10px;
      line-height:1.1;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      opacity:.92;
    }

    .lt-title h1{
      margin:0;
      font-size:22px;
      line-height:1;
      font-weight:900;
      letter-spacing:-.02em;
    }

    .lt-title p{
      margin:4px 0 0;
      font-size:11px;
      opacity:.9;
    }

    .lt-live{
      text-align:right;
      flex:0 0 auto;
    }

    .lt-live-badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:5px 8px;
      border:1px solid rgba(255,255,255,.35);
      background:rgba(0,0,0,.13);
      font-size:10px;
      font-weight:800;
      letter-spacing:.07em;
      text-transform:uppercase;
    }

    .lt-live-dot{
      width:6px;
      height:6px;
      border-radius:50%;
      background:#fff;
    }

    .lt-updated{
      margin-top:5px;
      font-size:10px;
      opacity:.84;
      white-space:nowrap;
    }

    .lt-mobile-hint{
      display:none;
      padding:6px 10px;
      background:#fafafa;
      border-bottom:1px solid var(--line);
      color:var(--muted);
      font-size:10px;
      text-align:center;
    }

    .lt-table-wrap{
      width:100%;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:thin;
      background:var(--white);
    }

    table{
      width:100%;
      min-width:780px;
      border-collapse:collapse;
    }

    thead th{
      background:var(--black);
      color:var(--white);
      padding:9px 6px;
      text-align:center;
      font-size:10px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    thead th.team{
      text-align:left;
      padding-left:10px;
      min-width:205px;
    }

    tbody tr:nth-child(even):not(.is-llanelli){
      background:var(--offwhite);
    }

    tbody td{
      padding:8px 6px;
      border-bottom:1px solid var(--line);
      text-align:center;
      font-size:12px;
      white-space:nowrap;
    }

    tbody td.team{
      text-align:left;
      padding-left:10px;
      font-weight:700;
      white-space:normal;
    }

    tbody td.pos,
    tbody td.pts{
      font-weight:900;
    }

    tbody tr.is-llanelli{
      background:linear-gradient(90deg,var(--red),#bd1218);
      color:var(--white);
      font-weight:800;
    }

    tbody tr.is-llanelli td{
      border-bottom-color:rgba(255,255,255,.16);
    }

    .team-inner{
      display:flex;
      align-items:center;
      gap:7px;
      min-width:0;
    }

    .team-mark{
      width:22px;
      height:22px;
      flex:0 0 22px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:#dedfe2;
      color:#333;
      font-size:8px;
      font-weight:900;
    }

    .is-llanelli .team-mark{
      background:#fff;
      color:var(--red);
    }

    .team-name{
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .gd-pos{color:#147746;font-weight:800}
    .gd-neg{color:#b21319;font-weight:800}
    .is-llanelli .gd-pos,
    .is-llanelli .gd-neg{color:#fff}

    .form{
      display:flex;
      justify-content:center;
      gap:2px;
    }

    .form span{
      width:18px;
      height:18px;
      display:inline-grid;
      place-items:center;
      border-radius:50%;
      color:#fff;
      font-size:8px;
      font-weight:900;
      line-height:1;
    }

    .form .w{background:var(--win)}
    .form .d{background:var(--draw)}
    .form .l{background:var(--loss)}

    .is-llanelli .form span{
      border:1px solid rgba(255,255,255,.45);
    }

    .lt-footer{
      padding:7px 10px;
      background:#fafafa;
      color:var(--muted);
      border-top:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      gap:8px;
      flex-wrap:wrap;
      font-size:9px;
      line-height:1.35;
    }

    .lt-error{
      padding:26px 14px;
      text-align:center;
      color:#9e141a;
      font-weight:700;
    }

    @media (max-width:760px){
      .lt-header{
        padding:10px 12px;
      }

      .lt-crest{
        width:36px;
        height:36px;
        flex-basis:36px;
        font-size:10px;
      }

      .lt-title h1{
        font-size:19px;
      }

      .lt-title p{
        display:none;
      }

      .lt-live{
        display:none;
      }

      .lt-mobile-hint{
        display:block;
      }

      table{
        min-width:700px;
      }

      thead th{
        padding:8px 5px;
        font-size:9px;
      }

      tbody td{
        padding:7px 5px;
        font-size:11px;
      }

      thead th.team{
        min-width:185px;
      }

      .form span{
        width:17px;
        height:17px;
        font-size:7px;
      }
    }

    @media (max-width:420px){
      .lt-club{
        font-size:9px;
      }

      .lt-title h1{
        font-size:17px;
      }

      .lt-crest{
        width:32px;
        height:32px;
        flex-basis:32px;
        font-size:9px;
      }

      table{
        min-width:660px;
      }

      thead th.team{
        min-width:172px;
      }

      tbody td.team{
        max-width:172px;
      }
    }
  </style>
</head>
<body>
  <section class="lt-widget" aria-label="Llanelli Town AFC Cymru South league table">
    <div class="lt-topbar"></div>

    <header class="lt-header">
      <div class="lt-brand">
        <div class="lt-crest" aria-hidden="true">LTAFC</div>
        <div class="lt-title">
          <div class="lt-club">Llanelli Town AFC</div>
          <h1>Cymru South</h1>
          <p>Official league standings</p>
        </div>
      </div>

      <div class="lt-live">
        <div class="lt-live-badge">
          <span class="lt-live-dot"></span>
          Live table
        </div>
        <div class="lt-updated" id="ltUpdated">Loading latest data…</div>
      </div>
    </header>

    <div class="lt-mobile-hint">Swipe sideways to view the full table</div>

    <div class="lt-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Pos</th>
            <th class="team">Team</th>
            <th>P</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
            <th>GF</th>
            <th>GA</th>
            <th>GD</th>
            <th>Pts</th>
            <th>Form</th>
          </tr>
        </thead>
        <tbody id="ltBody">
          <tr>
            <td colspan="11" style="padding:26px;text-align:center;">Loading league table…</td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer class="lt-footer">
      <span>Standings sourced from FAW competition data.</span>
      <span>Checks for updated standings every 5 minutes.</span>
    </footer>
  </section>

  <script>
    (() => {
      const API_URL = "./standings.json";
      const LLANELLI_ID = 27548;
      const REFRESH_MS = 5 * 60 * 1000;

      const body = document.getElementById("ltBody");
      const updated = document.getElementById("ltUpdated");

      const esc = (value) => String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

      const initials = (name) => {
        const clean = String(name || "").replace(/\b(AFC|FC)\b/gi, "").trim();
        const parts = clean.split(/\s+/).filter(Boolean);
        if (!parts.length) return "?";
        if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
      };

      const formHtml = (row) => {
        const games = [row.m1,row.m2,row.m3,row.m4,row.m5]
          .filter(x => x && x.result)
          .map(x => String(x.result).toUpperCase());

        if (!games.length) return "—";

        return `<div class="form">${games.map(r =>
          `<span class="${r.toLowerCase()}">${esc(r)}</span>`
        ).join("")}</div>`;
      };

      const rowHtml = (row) => {
        const gf = Number(row.goalsFor || 0);
        const ga = Number(row.goalsAgainst || 0);
        const gd = gf - ga;
        const gdText = gd > 0 ? `+${gd}` : String(gd);
        const gdClass = gd > 0 ? "gd-pos" : gd < 0 ? "gd-neg" : "";
        const isLlanelli = Number(row?.team?.id) === LLANELLI_ID;
        const name = row?.team?.name || "";

        return `
          <tr class="${isLlanelli ? "is-llanelli" : ""}">
            <td class="pos">${esc(row.position)}</td>
            <td class="team">
              <div class="team-inner">
                <span class="team-mark">${esc(initials(name))}</span>
                <span class="team-name">${esc(name)}</span>
              </div>
            </td>
            <td>${esc(row.played)}</td>
            <td>${esc(row.wins)}</td>
            <td>${esc(row.draws)}</td>
            <td>${esc(row.losses)}</td>
            <td>${esc(gf)}</td>
            <td>${esc(ga)}</td>
            <td class="${gdClass}">${esc(gdText)}</td>
            <td class="pts">${esc(row.points)}</td>
            <td>${formHtml(row)}</td>
          </tr>`;
      };

      async function load() {
        try {
          const separator = API_URL.includes("?") ? "&" : "?";
          const res = await fetch(API_URL + separator + "v=" + Date.now(), {
            method: "GET",
            cache: "no-store",
            headers: { "Accept":"application/json" }
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const data = await res.json();
          if (!Array.isArray(data)) throw new Error("Unexpected standings response");

          data.sort((a,b) => Number(a.position) - Number(b.position));
          body.innerHTML = data.map(rowHtml).join("");

          const now = new Date();
          updated.textContent = "Updated " + now.toLocaleTimeString([], {
            hour:"2-digit",
            minute:"2-digit"
          });
        } catch (err) {
          console.error(err);
          updated.textContent = "Unable to refresh";
          body.innerHTML = `<tr><td colspan="11" class="lt-error">
            The league table is temporarily unavailable.
          </td></tr>`;
        }
      }

      load();
      setInterval(load, REFRESH_MS);
    })();
  </script>
</body>
</html>
